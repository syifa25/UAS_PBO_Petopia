# ── Server ──────────────────────────────────────────────────
server.port=8080

# ── H2 file-based datasource ────────────────────────────────
spring.datasource.url=jdbc:h2:file:./data/petopia;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# update: adds missing columns/tables without dropping existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── H2 console (useful for debugging, disable in prod) ───────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Jackson ──────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
